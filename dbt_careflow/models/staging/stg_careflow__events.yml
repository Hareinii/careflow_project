version: 2

models:
  - name: stg_careflow__events
    description: >
      Cleaned and deduplicated EHR event log staging model.

      DEDUPLICATION (Day 5):
        Two-stage deduplication is applied.
        Stage 1: deduplicates on event_id (handles ETL re-load duplicates).
        Stage 2: deduplicates on business key (case_id, activity_name, event_timestamp),
        retaining the record with the lowest event_id.
        EVT019_DUP is excluded as a confirmed exact technical duplicate of EVT019.
        Raw source data is never modified.

      PRIORITY / JOURNEY TYPE PROVENANCE (Day 5):
        Both fields are NOT present in the source CSV.
        They are staging fabrications assigned as placeholder defaults ('High', 'Normal').
        They must NOT be treated as confirmed operational dimensions until real values
        are sourced from the EHR system. Treat as exploratory only.

    columns:
      - name: event_id
        description: >
          Unique event identifier after two-stage deduplication.
          EVT019_DUP has been excluded as an exact technical duplicate of EVT019.
          Uniqueness is enforced at the business-key level (case_id + activity_name + event_timestamp).
        tests:
          - unique
          - not_null

      - name: case_id
        description: Unique case/patient journey identifier.
        tests:
          - not_null
      - name: activity_name
        description: Type of healthcare activity.
        tests:
          - not_null
          - accepted_values:
              values: ['Doctor Review', 'Triage', 'Registration', 'Doctor Consultation', 'Discharge', 'X-Ray', 'Doctor Assessment']
      - name: event_timestamp
        description: Timestamp of the event.
        tests:
          - not_null
      - name: department
        description: Department where event occurred.
        tests:
          - not_null
          - accepted_values:
              values: ['Emergency', 'Radiology']
      - name: doctor_id
        description: Healthcare provider identifier.
        tests:
          - not_null
      - name: priority
        description: Priority level of the case.
        tests:
          - not_null
          - accepted_values:
              values: ['High', 'Low', 'Medium']
      - name: journey_type
        description: Classification of patient journey.
        tests:
          - not_null
          - accepted_values:
              values: ['Normal', 'Loopback', 'Delayed']
      - name: source_row
        description: Row number from source extract.
        tests:
          - not_null
      - name: source_system
        description: Identifier of source system.
        tests:
          - not_null
          - accepted_values:
              values: ['WaitData.Published_F1', 'EHR']

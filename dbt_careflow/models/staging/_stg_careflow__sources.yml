version: 2

sources:
  - name: careflow
    database: "{{ env_var('DBT_GCP_PROJECT', 'careflow-507606') }}"
    schema: "{{ env_var('DBT_GCP_DATASET', 'careflow') }}"
    description: |
      Raw EHR healthcare event log in Google Cloud BigQuery.
      Physical location: careflow-507606.careflow.raw_ehr_events
      Contains 21 raw event records across patient cases.
    tables:
      - name: raw_ehr_events
        description: "One row per activity or event for a patient case journey."
        columns:
          - name: event_id
            description: "Unique event identifier within a case. Example: EVT001."
          - name: case_id
            description: "Unique patient or case journey identifier. Example: PAT001."
          - name: activity_name
            description: "Type of healthcare activity or event such as Registration, Triage, Doctor Assessment, X-Ray, Doctor Review, Discharge."
          - name: timestamp
            description: "Timestamp when the event occurred."
          - name: department
            description: "Department where the event occurred. Example: Emergency, Radiology."
          - name: doctor_id
            description: "Identifier of the clinician associated with the event. Example: DR001 through DR009."
          - name: source_system
            description: "System identifier for the data source. All records from EHR."
